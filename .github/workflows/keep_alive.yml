name: keep-supabase-alive
on:
  schedule:
    - cron: "0 3 * * 1,4"      # 월·목 새벽 3시(UTC) — 최대 공백 4일 (Supabase 정지 기준 7일)
  workflow_dispatch:
permissions:
  contents: write               # 아래 '스스로 흔적 남기기' 에 필요
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping all supabase projects
        env:
          A_URL: ${{ secrets.A_URL }}
          A_KEY: ${{ secrets.A_KEY }}
          B_URL: ${{ secrets.B_URL }}
          B_KEY: ${{ secrets.B_KEY }}
          C_URL: ${{ secrets.C_URL }}
          C_KEY: ${{ secrets.C_KEY }}
        run: |
          set -u
          fail=0
          # 프로젝트마다 테이블·함수가 달라서, 스키마와 무관하게 어디든 있는
          # /auth/v1/health 로 깨우기만 한다. 목적은 '활동 기록' 이지 기능 확인이 아니다.
          ping_one () {
            name="$1"; url="$2"; key="$3"
            if [ -z "$url" ] || [ -z "$key" ]; then
              echo "::error::$name 시크릿이 비어 있음 (URL 또는 KEY)"
              fail=1; return
            fi
            code=$(curl -s -o /tmp/o -w "%{http_code}" --max-time 30               "${url%/}/auth/v1/health" -H "apikey: $key") || code="연결실패"
            echo "$name -> $code  $(head -c 90 /tmp/o)"
            case "$code" in
              200) ;;
              000|연결실패) echo "::error::$name 에 연결 자체가 안 된다 (주소가 틀렸거나 프로젝트 삭제)"; fail=1 ;;
              5*)  echo "::error::$name 프로젝트가 멈춰 있다 ($code)"; fail=1 ;;
              *)   echo "::warning::$name 응답이 $code — 깨어는 있지만 키를 확인해 보라" ;;
            esac
          }
          ping_one A "$A_URL" "$A_KEY"
          ping_one B "$B_URL" "$B_KEY"
          ping_one C "$C_URL" "$C_KEY"
          if [ "$fail" -ne 0 ]; then
            echo "핑 실패가 있다 — 위 오류를 볼 것"
            exit 1
          fi
          echo "세 곳 모두 깨어 있음"

      # ⚠ 깃허브는 '레포에 60일간 커밋이 없으면' 예약 실행을 자동으로 끈다.
      #    그러면 핑이 멈추고 → Supabase 가 자고 → 고객 인증이 순차로 잠긴다.
      #    사람이 기억해야 하는 구조는 언젠가 터지므로, 돌 때마다 스스로 흔적을 남긴다.
      - name: keep this workflow from being auto-disabled
        if: always()
        run: |
          git config user.name  "keep-alive bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ  supabase ping" > .keepalive/last_run.txt
          git add .keepalive/last_run.txt
          git commit -m "keep-alive $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
