name: keep-alive
on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: photobook
        run: 'c=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.A_URL }}/rest/v1/rpc/check_license" -H "apikey: ${{ secrets.A_KEY }}" -H "Authorization: Bearer ${{ secrets.A_KEY }}" -H "Content-Type: application/json" -d "{\"p_key\":\"__ping__\",\"p_device\":\"__ping__\"}"); echo "photobook $c"; test "$c" = "200"'
      - name: motionkit
        run: 'c=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.B_URL }}/rest/v1/rpc/check_license" -H "apikey: ${{ secrets.B_KEY }}" -H "Authorization: Bearer ${{ secrets.B_KEY }}" -H "Content-Type: application/json" -d "{\"c\":\"__ping__\",\"d\":\"__ping__\"}"); echo "motionkit $c"; test "$c" = "200"'
      - name: auraframe
        run: 'c=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.C_URL }}/rest/v1/rpc/check_auraframe_license" -H "apikey: ${{ secrets.C_KEY }}" -H "Content-Type: application/json" -d "{\"p_key\":\"__ping__\",\"p_device_hash\":\"__ping__\",\"p_app_version\":\"0.0.0\"}"); echo "auraframe $c"; test "$c" = "200"'
